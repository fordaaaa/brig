# brig service for the homelab gateway. Own repo, own volumes, own healthcheck.
# Bring up from here:  docker compose -f deploy/docker-compose.yml up -d --build
# Index a mounted checkout: docker compose -f deploy/docker-compose.yml exec brig brig index /repos/<name> --slug <name>
# Then: http://localhost/brig/api/v1/search?slug=<name>&q=<query>
name: brig

services:
  brig:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: brig
    volumes:
      - brig-index:/root/.brig
      - ./repos:/repos:ro
    networks:
      - default
      - homelab-gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-gateway"
      - "traefik.http.routers.brig.rule=PathPrefix(`/brig`)"
      - "traefik.http.routers.brig.entrypoints=web"
      - "traefik.http.routers.brig.priority=10"
      - "traefik.http.routers.brig.middlewares=strip-brig-prefix@file"
      - "traefik.http.services.brig.loadbalancer.server.port=8000"

volumes:
  brig-index:

networks:
  homelab-gateway:
    external: true
